<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中途社員ダッシュボード</title>
<style>
:root{--main:#1f3a5f;--acc:#e8572a;--bg:#f4f6f9;--line:#dde3ea;--ok:#2e8b57;--warn:#e0a100;--ng:#d64545;--pre:#7a869a}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Meiryo",sans-serif;background:var(--bg);color:#222;font-size:14px}
header{background:var(--main);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:18px}
header .sub{font-size:11px;opacity:.8;margin-top:2px}
.hbtn{position:absolute;right:12px;top:12px;display:flex;gap:6px}
.hbtn button{background:#fff2;color:#fff;border:1px solid #fff6;border-radius:6px;padding:6px 10px;font-size:12px}
nav{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:19}
nav button{flex:1 0 auto;border:0;background:none;padding:12px 14px;font-size:14px;font-weight:bold;color:#667;border-bottom:3px solid transparent}
nav button.on{color:var(--main);border-color:var(--acc)}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
.filters select,.filters input{padding:8px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;flex:1 1 120px;min-width:0}
main{padding:12px;max-width:1200px;margin:0 auto}
.page{display:none}.page.on{display:block}
.pt{font-size:16px;font-weight:bold;color:var(--main);margin:6px 0 10px;border-left:5px solid var(--acc);padding-left:8px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border-radius:10px;padding:10px;text-align:center;border:1px solid var(--line)}
.kpi .l{font-size:12px;color:#667}.kpi .v{font-size:26px;font-weight:bold;color:var(--main)}
.kpi.ng .v{color:var(--ng)}.kpi.warn .v{color:var(--warn)}.kpi.ok .v{color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--main)}
.bar{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:12px}
.bar .bl{width:64px;flex:none;text-align:right}
.bar .bt{flex:1;display:flex;height:18px;background:#eef1f5;border-radius:4px;overflow:hidden}
.bar .bn{width:28px;flex:none;font-weight:bold}
.seg-在籍中{background:var(--ok)}.seg-要確認{background:var(--warn)}.seg-退職済{background:var(--ng)}.seg-入社前{background:var(--pre)}
.legend{display:flex;gap:10px;font-size:11px;margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:middle}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px;background:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
th{background:#eaf0f7;position:sticky;top:0;z-index:2;font-size:12px}
th:first-child,td:first-child{position:sticky;left:0;background:#fff;z-index:1;border-right:1px solid var(--line)}
th:first-child{background:#eaf0f7;z-index:3}
td.num,th.num{text-align:right}
tbody tr{cursor:pointer}tbody tr:hover td{background:#f7f9fc}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;color:#fff;font-weight:bold}
.b-在籍中{background:var(--ok)}.b-要確認{background:var(--warn)}.b-退職済{background:var(--ng)}.b-入社前{background:var(--pre)}
.mk{font-weight:bold}.mk.o{color:var(--ok)}.mk.x{color:var(--ng)}.mk.n{color:#bbb}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.fc{background:#fff;border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:10px;padding:12px;cursor:pointer}
.fc.ng{border-left-color:var(--ng)}
.fc .nm{font-size:16px;font-weight:bold}.fc .meta{font-size:12px;color:#667;margin:2px 0 6px}
.fc .cc{font-size:12px;white-space:pre-wrap;background:#fff8e6;border-radius:6px;padding:6px}
.fc .last{font-size:12px;color:#444;margin-top:6px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:50;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.mbox{background:#fff;width:100%;max-width:760px;max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px}
.mbox h2{margin:0 0 4px;font-size:18px}
.mbox .close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px;font-size:18px}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0;font-size:12px}
.info div{background:var(--bg);border-radius:6px;padding:6px}.info b{display:block;color:#667;font-weight:normal;font-size:11px}
.sec{font-weight:bold;color:var(--main);margin:12px 0 4px}
.entry{border-left:3px solid var(--main);padding:4px 8px;margin:6px 0;white-space:pre-wrap;font-size:13px;line-height:1.6}
.entry .h{font-weight:bold;color:var(--acc)}
.concern{white-space:pre-wrap;background:#fff8e6;border-radius:6px;padding:8px;font-size:13px}
.empty{color:#999;padding:20px;text-align:center}
#loading{padding:40px;text-align:center;color:#667}
@media (max-width:768px){
  .kpis{grid-template-columns:repeat(3,1fr)}.kpi .v{font-size:22px}
  .grid2{grid-template-columns:1fr}.info{grid-template-columns:1fr 1fr}
  header h1{font-size:16px}.hbtn button{padding:5px 8px}
}
@page{size:A4 portrait;margin:8mm}
@media print{
  body{background:#fff;font-size:11px}
  header{position:static;padding:6px 0;background:#fff;color:var(--main);border-bottom:2px solid var(--main)}
  .hbtn,nav,.filters,.modal,.sortbar{display:none!important}
  main{padding:0;max-width:none}
  .tw{max-height:none;overflow:visible;border:0}
  th,td{padding:4px;font-size:10px}
  th,td:first-child{position:static}
  .card,.fc,.kpi{break-inside:avoid}
  .fcards{grid-template-columns:1fr 1fr}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <h1>中途社員ダッシュボード</h1>
  <div class="sub" id="updated">読み込み中…</div>
  <div class="hbtn"><button onclick="load()">↻ 更新</button><button onclick="window.print()">PDF</button></div>
</header>
<nav>
  <button class="on" data-p="sum">サマリー</button>
  <button data-p="list">社員一覧</button>
  <button data-p="follow">要フォロー</button>
  <button data-p="mtg">面談状況</button>
  <button data-p="store">店舗別</button>
</nav>
<div class="filters">
  <select id="fYear"></select>
  <select id="fType"></select>
  <select id="fStatus"></select>
  <select id="fStore"></select>
  <input id="fQ" placeholder="氏名・キーワード検索">
</div>
<main>
  <div id="loading">データを読み込み中…</div>
  <section class="page on" id="p-sum"></section>
  <section class="page" id="p-list"></section>
  <section class="page" id="p-follow"></section>
  <section class="page" id="p-mtg"></section>
  <section class="page" id="p-store"></section>
</main>
<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="mbox" id="mbox"></div></div>

<script>
const PREVIEW_DATA = {"rows": [{"year": "2025", "name": "佐藤 柊吾", "type": "中途_カンテラ", "status": "退職済", "curBiz": "C", "curStore": "蒲田", "iniBiz": "C", "iniStore": "横浜鶴屋町", "start": "2025/09/01", "ym": "2025/09", "training": "/", "startForm": "直社員", "mPre": "-", "mPost": "-", "party": "x", "log": "【2025/12/25：営業】\n2年程アルバイト後、9月から社員登用。当日は主にサイドを担当しており、オペレーション力、適切なホールフォローが良く出来ていた。今後はお客様最優先での判断力、アルバイトさんと馴れ合い過ぎず、社員として一線引けるようなコミュニケーションの取り方や発言、社員としての営業内での存在感がついてくると良い。元々体調を崩しやすい。\n【2026/4：CONA横浜鶴屋町店からCONA蒲田店に店舗異動】\n【2026/5：深夜労働が合わず退職】", "concern": "・体調管理（深夜リズム）\n・社員としてのアルバイトさんとの関わり方"}, {"year": "2025", "name": "古庄 美彦", "type": "中途", "status": "在籍中", "curBiz": "C", "curStore": "大宮", "iniBiz": "C", "iniStore": "西新宿一丁目", "start": "2025/09/01", "ym": "2025/09", "training": "/", "startForm": "アルバイト", "mPre": "-", "mPost": "-", "party": "x", "log": "【2026/1/13：営業】\n入社後3ヶ月半程が経過。当日はフリーで動いており、ポジション全体や新人さんを気に掛ける意識は良かった。今後は活気面やお客様意識、アルバイトさんと馴れ合い過ぎず、距離は近くも社員として一線引けるようなコミュニケーションの取り方や発言ができると良い。\n【2026/3：CONA西新宿一丁目店からCONA田町芝浦店に店舗異動】\n【2026/4：店長より共有】\nイコマくんへの言い方など当たりの強さが気になるとのこと。ヘルプで入った本部社員からも同内容の共有有。\n【2026/6/16：CONA田町芝浦店からCONA大宮店に店舗異動】\n大宮店で岩本AMのもとで主に人間性を改善できるかが課題。", "concern": "・メンタル管理\n・モチベーション管理\n・社員としてのアルバイトさんとの関わり方\n・対上司、対部下の態度の差\n・差別的発言など人間性"}, {"year": "2025", "name": "木本 尚弘", "type": "その他", "status": "在籍中", "curBiz": "C", "curStore": "麻布十番", "iniBiz": "C", "iniStore": "麻布十番", "start": "2025/09/01", "ym": "2025/09", "training": "/", "startForm": "アルバイト", "mPre": "-", "mPost": "-", "party": "o", "log": "", "concern": ""}, {"year": "2025", "name": "大城 涼弥", "type": "中途", "status": "在籍中", "curBiz": "他", "curStore": "ナポリマン", "iniBiz": "C", "iniStore": "たまプラーザ", "start": "2025/10/01", "ym": "2025/10", "training": "/", "startForm": "直社員", "mPre": "-", "mPost": "-", "party": "o", "log": "【2025/10/25：懇親会】\n入社後1ヶ月程が経過。前職が単価の高いビストロであり、キッチンに関してはスピード面とクオリティ面の折り合いをつけるのが難しい一方、ホールに関しては丁寧な接客スタイルでお客様に喜んでいただき、やりがいに繋がっているとのこと。目黒店長のやり方についていけるかが課題。\n【2026/1：CONAたまプラーザ店からナポリマンに業態異動】", "concern": "・CONAのへのやり 025/12", "training": "2025/11/25", "startForm": "アルバイト", "mPre": "-", "mPost": "-", "party": "o", "log": "【2025/12/5：営業】\n11月からアルバイトをした後入社。ホールスタートで、ドリンクにも少し取り組んでいるとのこと。飲食店で学生社員としてのアルバイト経験もある為、接客が良かった。社員との関係性は良好に見える。当日遅刻してきており、勤務態度は要観察。\n【2026/2/15：営業・面談】\n入社後約3ヶ月が経過し、ホール、ドリンクを習得し、当日はピザを担当していた。週末でも充分戦えていたが、前の週にピークで10段空いた日は心が折れそうだったと話していた。入社と殆ど同時期に店舗の2番手であった社員が退職し、ここ数か月は大変だったが徐々に慣れてきたとのことで、店舗環境に対しても割り切り、自分にできることを頑張る姿勢が良かった。現在は元社員のフリーターさんと共に、自分が責任者としての営業も行っている。1月入社の外国人社員のナンダーさんとの関わり方に悩んでいたが、文句を言ったり、見放したりするのではなく、本人と話し合い、伝え方を工夫し、お互いが働きやすい環境がつくれるよう試行錯誤しているとのことで、物事の捉え方やアプローチも素晴らしいと感じた。堀江AMは一旦元社員の方なしで一日の営業を任せられるようにしたいと話していた。", "concern": "・勤務態度（遅刻）"}, {"year": "2025", "name": "片桐 伸吾", "type": "中途", "status": "在籍中", "curBiz": "C", "curStore": "渋谷宇田川町", "iniBiz": "C", "iniStore": "渋谷宇田川町", "start": "2025/12/01", "ym": "2025/12", "training": "2025/11/25", "startForm": "直社員", "mPre": "-", "mPost": "-", "party": "x", "log": "【2025/12/11：営業・面談】\n入社後10日程が経過。初日からピザスタート。前職でピザを焼いた経験があり、組み立ても自分なりに考えてオーダーを捌くことが出来ていた。経験故レシピの適正量を覚えておらずブレのある料理があった為、店舗側も覚える段階を丁寧に指導できる（田尻店長不在日であり、料理の最終確認意識など細かい部分のフォローが少なかった）と良さそう。職場環境への期待感が元々あまりなく、スタッフ間の関係も良好とのこと。感情、モチベーションの起伏が少なく、仕事、私生活共に省エネな人という印象である為、マネジメントが難しいと感じた。", "concern": "・意欲の向上"}, {"year": "2025", "name": "山口 善美", "type": "中途", "status": "在籍中", "curBiz": "C", "curStore": "横浜西口", "iniBiz": "J", "iniStore": "横浜", "start": "2025/12/01", "ym": "2025/12", "training": "/", "startForm": "アルバイト", "mPre": "-", "mPost": "-", "party": "o", "log": "【2026/3：焼売のジョーからCONAに業態異動】\n【2026/4：CONA川崎店から新店舗CONA横浜西口店に異動】", "concern": ""}, {"year": "2025", "name": "ハエダルヌル イコマ トゥディン", "type": "外国人", "status": "退職済", "curBiz": "C", "curStore": "田町芝浦", "iniBiz": "C", "iniStore": "田町芝浦", "start": "2025/12/01", "ym": "2025/12", "training": "2025/11/28", "startForm": "直社員", "mPre": "-", "mPost": "-", "party": "o", "log": "【2025/12/17：営業・面談】\n入社後10日程が経過。初日からホールスタートで、既に深夜ドリンクやピザにも挑戦しているとのこと。ホールは言語面や元々少し早口なこともあり、お客様と上手くコミュニケーションを取れない場面もあったが、ファーストトークや提供は行えていた。分からないことを聞かずに判断してしまったり、またアプリ対応は難しそうな様子であった為、社員数や店舗環境的に細かなホール教育が難しそうな場合は、先に中のポジションから入れていく方が良いかもしれない。本人も言語面で苦戦していると話していたが、明るく前向きな性格もあり、スタッフ間の関係性は問題ないとのこと。体力面（深夜）も現状問題なし。岡本店長は社員の丈くんとの関係性を心配していた。直感的な判断や行動にまだ少し若さを感じる為、今後責任感がついてくると良い。\n【2026/5：外国人採用チームより共有】\n古庄君からの当たりが強く、差別的な発言もあり、働きづらいとのこと。6月中旬に古庄君は異動するので要経過観察。\n【2026/6/18：面談】\n外国人採用チームがイコマ君の同期のルル君から、転職を考えている可能性があると聞き面談。以前日本語学校に申し込んでおり、その後音沙汰がなく、話が流れたかと思っていたが、ちょうど面談の前々日に入学許可が下りたとのこと。進学する場合は10月から、期間は1年半で、日本語以外にも数学など他の学問も学ぶことができ、一番の理由としては義人国ビザが取得できることが大きいそう。大学に通う場合、7,8月に国に帰り、書類等を纏め、10月から進学したく、入学後もCONAでアルバイトとして勤務継続はしたい。、面談の前日に岡本店長と話し、CONA自体は好きなので迷っている。ポジションも一通りでき、今後精度を求めていく段階で、ドリンクの発注にも取り組んでおり、チーフCを目指せる能力もつけており、店舗内でも頼りにされ、必要とされるポジションにあることは本人のこれまでの努力故なので、今後もINGSで成長していってほしいという話はした。7月前半には結論を出さなければいけないので、矢野AMや岡本店長、外国人採用チームからも話してもらい、出来ることはしていきたい。\nラーメンもやってみたいとの発言や、福利厚生で家賃補助がない部分への不満など、INGSのCONAを選んだが他への興味も多く、より条件のいい会社を探していたりと、INGS自体は繋ぎで入社した可能性もある。", "concern": "・社会人としての責任感、判断力\n・人間関係（古庄君との）\n・好奇心、社会人としての甘さ\n・日本語学校への進学"}, {"year": "2025", "name": "ミャッ ノー ワイ", "type": "外国人", "status": "退職済", "curBiz": "C", "curStore": "川崎", "iniBiz": "C", "iniStore": "川崎", "start": "2025/12/01", "ym": "2025/12", "training": "2025/11/28", "startForm": "直社員", "mPre": "-", "mPost": "-", "party": "o", "log": "【2025/12/20：営業・面談】\n入社後半月程が経過。初日からホールスタート。ファーストトーク、アプリ対応などは問題なく、コース説明やお客様からのイレギュラーな質問にも落ち着いて対応出来ていた。個人の活気もあり、またデシャップ意識も高く、良く気がつけていた。途中調理提供時の取り皿交換についてアドバイスした後、すぐに行動に移し実行できており、成長意欲も良かった。アルバイトさん含め、他のスタッフも常に気にかけてあげる意識があり、店舗の教育環境も良かった。体力面（深夜）も現状問題なし。自分からフィードバックを聞きにいき、アドバイスは即実践しようと意識していると話しており、言語面は今後伸ばしていきたいとのこと。入社時懸念されていた敬語も問題なさそうであった。", "concern": ""}, {"year": "2025", "name": "志水 咲弥", "type": "中途_カンテラ", "status": "在籍中", "curBiz": "C", "curStore": "大宮", "iniBiz": "C", "iniStore": "大宮", "start": "2025/12/01", "ym": "2025/12", "training": "/", "startForm": "アルバイト", "mPre": "-", "mPost": "-", "party": "o", "log": "【2026/1/15：営業】\n3年半程アルバイト後、12月から社員登用。営業内での存在感、指示出し、新人さん指導力、入口・客席意識全てのレベルが高かった。一方発言や言い回しの強さ、立ち居振る舞いに関しては、より良い店舗環境の醸成やお客様からの見え方の観点で少し改善できると良い。", "concern": "・物事の伝え方の const STATUSES = ['在籍中','要確認','退職済','入社前'];
let ALL = [], VIEW = [];

function load(){
  document.getElementById('loading').style.display='block';
  if (window.google && google.script && google.script.run){
    google.script.run.withSuccessHandler(init).withFailureHandler(e=>{
      document.getElementById('loading').textContent='読み込みエラー：'+e.message;}).getData();
  } else if (PREVIEW_DATA){ init(PREVIEW_DATA); }
}
function init(d){
  ALL = d.rows.map((r,i)=>({...r,id:i,store:normStore(r.curStore)}));
  document.getElementById('updated').textContent='最終取得：'+d.updated+'　全'+ALL.length+'名';
  document.getElementById('loading').style.display='none';
  fillSel('fYear','年：すべて',uniq(ALL.map(r=>r.year)));
  fillSel('fType','雇用形態：すべて',uniq(ALL.map(r=>r.type)));
  fillSel('fStatus','在籍状況：すべて',STATUSES.filter(s=>ALL.some(r=>r.status===s)));
  fillSel('fStore','店舗：すべて',uniq(ALL.map(r=>r.store)).sort((a,b)=>a.localeCompare(b,'ja')));
  render();
}
function normStore(s){return (s||'').replace('川﨑','川崎');}
function uniq(a){return [...new Set(a.filter(Boolean))];}
function fillSel(id,lab,opts){
  const el=document.getElementById(id),cur=el.value;
  el.innerHTML='<option value="">'+lab+'</option>'+opts.map(o=>`<option>${esc(o)}</option>`).join('');
  if(opts.includes(cur)) el.value=cur;
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
['fYear','fType','fStatus','fStore','fQ'].forEach(id=>document.getElementById(id).addEventListener('input',render));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.p));
  window.scrollTo(0,0);
});

function render(){
  const y=fYear.value,t=fType.value,s=fStatus.value,st=fStore.value,q=fQ.value.trim();
  VIEW=ALL.filter(r=>(!y||r.year===y)&&(!t||r.type===t)&&(!s||r.status===s)&&(!st||r.store===st)
    &&(!q||[r.name,r.store,r.iniStore,r.log,r.concern].join(' ').includes(q)));
  renderSum();renderList();renderFollow();renderMtg();renderStore();
}
function cnt(rows){const c={total:rows.length};STATUSES.forEach(s=>c[s]=rows.filter(r=>r.status===s).length);
  c.joined=c.total-c['入社前'];c.rate=c.joined?c['退職済']/c.joined:0;return c;}
function pct(v){return (v*100).toFixed(1)+'%';}
function stackBar(label,rows,max){
  const c=cnt(rows);
  const segs=STATUSES.map(s=>c[s]?`<div class="seg-${s}" style="width:${c[s]/max*100}%" title="${s} ${c[s]}"></div>`:'').join('');
  return `<div class="bar"><div class="bl">${esc(label)}</div><div class="bt">${segs}</div><div class="bn">${c.total}</div></div>`;
}
const LEGEND='<div class="legend">'+STATUSES.map(s=>`<span><i class="seg-${s}"></i>${s}</span>`).join('')+'</div>';

function renderSum(){
  const c=cnt(VIEW);
  const months=uniq(VIEW.map(r=>r.ym)).sort();
  const mMax=Math.max(1,...months.map(m=>VIEW.filter(r=>r.ym===m).length));
  const types=uniq(VIEW.map(r=>r.type));
  const tMax=Math.max(1,...types.map(t=>VIEW.filter(r=>r.type===t).length));
  const typeRows=types.map(t=>{const x=cnt(VIEW.filter(r=>r.type===t));
    return `<tr><td>${esc(t)}</td><td class="num">${x.total}</td><td class="num">${x['在籍中']}</td><td class="num">${x['要確認']}</td><td class="num">${x['退職済']}</td><td class="num">${pct(x.rate)}</td></tr>`;}).join('');
  document.getElementById('p-sum').innerHTML=`
  <div class="pt">サマリー</div>
  <div class="kpis">
    <div class="kpi"><div class="l">入社数</div><div class="v">${c.joined}</div></div>
    <div class="kpi ok"><div class="l">在籍中</div><div class="v">${c['在籍中']}</div></div>
    <div class="kpi warn"><div class="l">要確認</div><div class="v">${c['要確認']}</div></div>
    <div class="kpi ng"><div class="l">退職済</div><div class="v">${c['退職済']}</div></div>
    <div class="kpi ng"><div class="l">離職率</div><div class="v">${pct(c.rate)}</div></div>
    <div class="kpi"><div class="l">入社予定</div><div class="v">${c['入社前']}</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>入社月別 人数</h3>${LEGEND}${months.map(m=>stackBar(m,VIEW.filter(r=>r.ym===m),mMax)).join('')||'<div class="empty">該当なし</div>'}</div>
    <div class="card"><h3>雇用形態別</h3>${LEGEND}${types.map(t=>stackBar(t,VIEW.filter(r=>r.type===t),tMax)).join('')}
      <div class="tw" style="margin-top:10px"><table><thead><tr><th>雇用形態</th><th class="num">人数</th><th class="num">在籍</th><th class="num">要確認</th><th class="num">退職</th><th class="num">離職率</th></tr></thead><tbody>${typeRows}</tbody></table></div>
    </div>
  </div>
  <div class="card" style="font-size:11px;color:#667">※ 離職率＝退職済 ÷ 入社数（入社前の方は除外）。入社月は「年」列＋雇用開始日の月で集計。</div>`;
}
function mk(v){return v==='o'?'<span class="mk o">○</span>':v==='x'?'<span class="mk x">×</span>':'<span class="mk n">－</span>';}
function renderList(){
  const rows=VIEW.map(r=>`<tr onclick="openM(${r.id})"><td><b>${esc(r.name)}</b></td><td><span class="badge b-${r.status}">${r.status}</span></td><td>${esc(r.type)}</td><td>${esc(r.store)}</td><td>${esc(r.iniStore)}</td><td>${esc(r.ym)}</td><td>${esc(r.startForm)}</td><td>${r.concern?'⚠ '+esc(r.concern.split('\n')[0].replace(/^・/,'')):''}</td></tr>`).join('');
  document.getElementById('p-list').innerHTML=`<div class="pt">社員一覧（${VIEW.length}名）<span style="font-size:11px;color:#667;font-weight:normal">　行をタップで詳細</span></div>
  <div class="tw"><table><thead><tr><th>氏名</th><th>状況</th><th>雇用形態</th><th>現所属</th><th>初期配属</th><th>入社月</th><th>開始時形態</th><th>懸念点</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">該当なし</td></tr>'}</tbody></table></div>`;
}
function entries(log){
  if(!log) return [];
  return log.split(/(?=【)/).map(s=>s.trim()).filter(Boolean);
}
function renderFollow(){
  const tgt=VIEW.filter(r=>r.status==='要確認'||(r.status==='在籍中'&&r.concern&&r.concern!=='特になし'));
  const card=r=>{const e=entries(r.log);const last=e.length?e[e.length-1]:'記録なし';
    return `<div class="fc ${r.status==='要確認'?'ng':''}" onclick="openM(${r.id})"><div class="nm">${esc(r.name)} <span class="badge b-${r.status}">${r.status}</span></div>
    <div class="meta">${esc(r.type)}｜${esc(r.store)}｜${esc(r.ym)}入社</div>
    ${r.concern?`<div class="cc">${esc(r.concern)}</div>`:''}<div class="last">最新：${esc(last)}</div></div>`;};
  const a=tgt.filter(r=>r.status==='要確認'),b=tgt.filter(r=>r.status!=='要確認');
  document.getElementById('p-follow').innerHTML=`<div class="pt">要確認（${a.length}名）</div><div class="fcards">${a.map(card).join('')||'<div class="empty">該当なし</div>'}</div>
  <div class="pt" style="margin-top:18px">懸念点ありの在籍者（${b.length}名）</div><div class="fcards">${b.map(card).join('')||'<div class="empty">該当なし</div>'}</div>`;
}
let MTG_SORT='new';
function mtgDate(r){
  // 進捗記録の【日付：…面談…】から最新の面談日を取得
  let best=null;
  (r.log.match(/【[^】]*】/g)||[]).forEach(h=>{
    if(!/面談/.test(h)) return;
    const m=h.match(/(\d{4})\/(\d{1,2})(?:\/(\d{1,2}|上旬|中旬|下旬|月初|月末))?/);
    if(!m) return;
    const dmap={'上旬':5,'月初':1,'中旬':15,'下旬':25,'月末':28};
    const day=m[3]?(dmap[m[3]]||+m[3]):1;
    const key=(+m[1])*10000+(+m[2])*100+day;
    const label=m[1]+'/'+('0'+m[2]).slice(-2)+(m[3]?'/'+(dmap[m[3]]?m[3]:('0'+m[3]).slice(-2)):'');
    if(!best||key>best.key) best={key,label};
  });
  return best;
}
function setMtgSort(v){MTG_SORT=v;renderMtg();}
function renderMtg(){
  const tgt=VIEW.filter(r=>r.status!=='退職済').map(r=>({r,md:mtgDate(r)}));
  const rate=k=>{const t=tgt.filter(x=>x.r[k]!=='-');return t.length?`${t.filter(x=>x.r[k]==='o').length}/${t.length}`:'－';};
  const k=x=>x.md?x.md.key:null;
  tgt.sort((a,b)=>{
    if(MTG_SORT==='join') return (a.r.start>b.r.start?1:a.r.start<b.r.start?-1:0);
    const ka=k(a),kb=k(b);
    if(ka===null&&kb===null) return 0; if(ka===null) return 1; if(kb===null) return -1;
    return MTG_SORT==='new'?kb-ka:ka-kb;
  });
  const today=new Date();const tk=today.getFullYear()*10000+(today.getMonth()+1)*100+today.getDate();
  const ago=key=>{const d=new Date(Math.floor(key/10000),Math.floor(key/100)%100-1,key%100);return Math.floor((today-d)/86400000);};
  const rows=tgt.map(({r,md})=>{
    const days=md?ago(md.key):null;
    const warn=days!==null&&days>=90?' style="color:var(--ng);font-weight:bold"':'';
    return `<tr onclick="openM(${r.id})"><td><b>${esc(r.name)}</b></td><td${warn}>${md?esc(md.label):'<span style="color:#bbb">未実施</span>'}</td><td class="num"${warn}>${days!==null?days+'日前':''}</td><td>${esc(r.store)}</td><td>${esc(r.ym)}</td><td style="text-align:center">${mk(r.mPre)}</td><td style="text-align:center">${mk(r.mPost)}</td><td style="text-align:center">${mk(r.party)}</td><td class="num">${entries(r.log).length}</td></tr>`;}).join('');
  const btn=(v,l)=>`<button onclick="setMtgSort('${v}')" style="padding:8px 12px;border-radius:8px;border:1px solid ${MTG_SORT===v?'var(--main)':'var(--line)'};background:${MTG_SORT===v?'var(--main)':'#fff'};color:${MTG_SORT===v?'#fff':'#333'};font-size:13px;font-weight:bold">${l}</button>`;
  document.getElementById('p-mtg').innerHTML=`<div class="pt">面談・懇親会 実施状況（退職者除く）</div>
  <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
   <div class="kpi"><div class="l">入社前面談(AM)</div><div class="v">${rate('mPre')}</div></div>
   <div class="kpi"><div class="l">入社後面談</div><div class="v">${rate('mPost')}</div></div>
   <div class="kpi"><div class="l">懇親会(3ヶ月)</div><div class="v">${rate('party')}</div></div></div>
  <div class="sortbar" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px"><span style="font-size:12px;color:#667">並び替え：</span>${btn('new','最新面談日（新しい順）')}${btn('old','最新面談日（古い順）')}${btn('join','入社順')}</div>
  <div class="tw"><table><thead><tr><th>氏名</th><th>最新面談日</th><th class="num">経過</th><th>店舗</th><th>入社月</th><th>入社前</th><th>入社後</th><th>懇親会</th><th class="num">記録数</th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">該当なし</td></tr>'}</tbody></table></div>
  <div style="font-size:11px;color:#667;margin-top:6px">最新面談日：進捗記録の見出しに「面談」を含む日付の最新（「中旬」等は日付を推定して並び替え）。90日以上経過は赤字。<br>○実施　×未実施　－対象外（シート上「/」）</div>`;
}
function renderStore(){
  const stores=uniq(VIEW.map(r=>r.store));
  const data=stores.map(s=>({s,c:cnt(VIEW.filter(r=>r.store===s))})).sort((a,b)=>b.c.total-a.c.total);
  const max=Math.max(1,...data.map(d=>d.c.total));
  const rows=data.map(d=>`<tr><td><b>${esc(d.s)}</b></td><td class="num">${d.c.total}</td><td class="num">${d.c['在籍中']}</td><td class="num">${d.c['要確認']}</td><td class="num">${d.c['退職済']}</td><td class="num">${d.c['入社前']}</td><td class="num">${pct(d.c.rate)}</td></tr>`).join('');
  document.getElementById('p-store').innerHTML=`<div class="pt">店舗別（現所属）</div>
  <div class="grid2"><div class="card"><h3>人数</h3>${LEGEND}${data.map(d=>stackBar(d.s,VIEW.filter(r=>r.store===d.s),max)).join('')}</div>
  <div><div class="tw"><table><thead><tr><th>店舗</th><th class="num">人数</th><th class="num">在籍</th><th class="num">要確認</th><th class="num">退職</th><th class="num">入社前</th><th class="num">離職率</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
}
function openM(id){
  const r=ALL.find(x=>x.id===id);
  const e=entries(r.log).map(x=>{const m=x.match(/^(【[^】]*】)([\s\S]*)$/);return `<div class="entry">${m?`<span class="h">${esc(m[1])}</span>${esc(m[2])}`:esc(x)}</div>`;}).join('');
  document.getElementById('mbox').innerHTML=`<button class="close" onclick="closeM()">×</button>
  <h2>${esc(r.name)} <span class="badge b-${r.status}">${r.status}</span></h2>
  <div class="info"><div><b>雇用形態</b>${esc(r.type)}</div><div><b>現所属</b>${esc(r.curBiz)} ${esc(r.store)}</div><div><b>初期配属</b>${esc(r.iniBiz)} ${esc(r.iniStore)}</div>
  <div><b>雇用開始日</b>${esc(r.start)}</div><div><b>研修参加日</b>${esc(r.training)}</div><div><b>開始時形態</b>${esc(r.startForm)}</div>
  <div><b>入社前面談</b>${mk(r.mPre)}</div><div><b>入社後面談</b>${mk(r.mPost)}</div><div><b>懇親会</b>${mk(r.party)}</div></div>
  ${r.concern?`<div class="sec">懸念点</div><div class="concern">${esc(r.concern)}</div>`:''}
  <div class="sec">進捗記録</div>${e||'<div class="empty">記録なし</div>'}`;
  document.getElementById('modal').classList.add('on');
}
function closeM(){document.getElementById('modal').classList.remove('on');}
load();
</script>
</body>
